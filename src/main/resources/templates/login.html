<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container" style="max-width: 460px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">Log in</h4>

            <div class="alert alert-danger py-2" th:if="${loginError != null}" th:text="${loginError}">Error</div>

            <form method="post" th:action="@{/login}">
                <label class="form-label small mb-1">Email</label>
                <input type="email" name="email" class="form-control mb-3" th:value="${email}" required>
                <label class="form-label small mb-1">Password</label>
                <input type="password" name="password" class="form-control mb-3" required>
                <button type="submit" class="btn btn-dark w-100">Log in</button>
            </form>

            <hr>
            <p class="small text-muted mb-1">Demo accounts (password <b>pass123</b>):</p>
            <ul class="small text-muted mb-0">
                <li>riya@mail.com (Buyer)</li>
                <li>arjun@agency.com (Agent)</li>
                <li>neha@agency.com (Agent)</li>
                <li>admin@estate.com (Admin)</li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
