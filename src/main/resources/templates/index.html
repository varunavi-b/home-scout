<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
        <h1 class="display-5 fw-bold">Find your next property</h1>
        <p class="lead">Search listings using many filters at once.</p>
        <a class="btn btn-dark btn-lg" th:href="@{/listings}">Browse listings</a>
        <a class="btn btn-outline-dark btn-lg" th:href="@{/login}" th:if="${currentUser == null}">Log in</a>
    </div>

    <div class="card shadow-sm" th:if="${currentUser == null}">
        <div class="card-body">
            <h5 class="card-title">Demo accounts (password: pass123)</h5>
            <table class="table table-sm mb-0">
                <tbody>
                <tr><td>riya@mail.com</td><td>Buyer</td></tr>
                <tr><td>arjun@agency.com</td><td>Agent</td></tr>
                <tr><td>neha@agency.com</td><td>Agent</td></tr>
                <tr><td>admin@estate.com</td><td>Admin</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
