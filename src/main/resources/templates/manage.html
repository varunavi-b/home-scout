<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage listings - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0" th:text="${heading}">My listings</h2>
        <a class="btn btn-dark" th:href="@{/manage/new}" th:if="${currentUser != null and currentUser.agent}">+ Add listing</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>Title</th><th>Type</th><th>City</th><th>Price</th><th>Status</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rows}">
                    <td th:text="${r.id}">1001</td>
                    <td><a th:href="@{/listings/{id}(id=${r.id})}" th:text="${r.title}">Title</a></td>
                    <td th:text="${r.type}">Type</td>
                    <td th:text="${r.city}">City</td>
                    <td th:text="${r.price}">Price</td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${r.statusClass}" th:text="${r.status}">Status</span></td>
                    <td class="text-nowrap">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/manage/{id}/edit(id=${r.id})}">Edit</a>

                        <form class="d-inline" method="post" th:action="@{/manage/{id}/status(id=${r.id})}">
                            <select name="status" class="form-select form-select-sm d-inline w-auto">
                                <option value="Available" th:selected="${r.status == 'Available'}">Available</option>
                                <option value="Sold" th:selected="${r.status == 'Sold'}">Sold</option>
                                <option value="Rented" th:selected="${r.status == 'Rented'}">Rented</option>
                            </select>
                            <button type="submit" class="btn btn-outline-dark btn-sm">Set</button>
                        </form>

                        <form class="d-inline" method="post" th:action="@{/manage/{id}/delete(id=${r.id})}"
                              onsubmit="return confirm('Delete this listing for good?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="text-center text-muted py-4" th:if="${rows.isEmpty()}">No listings yet.</div>
</div>

</body>
</html>
