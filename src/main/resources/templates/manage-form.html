<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listing form - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>

<div class="container pb-5" style="max-width: 820px;">
    <h2 class="mb-3" th:text="${editing} ? ('Edit listing #' + ${p.id}) : 'Add a new listing'">Listing</h2>

    <form method="post" th:action="${editing} ? @{/manage/{id}(id=${p.id})} : @{/manage}"
          class="card card-body shadow-sm">

        <div class="alert alert-danger" th:if="${errors['form'] != null}" th:text="${errors['form']}">Problem</div>
        <div class="alert alert-danger" th:if="${!errors.isEmpty() and errors['form'] == null}">
            Please fix the problems shown in red below.
        </div>

        <!-- ===== edit mode: what cannot be changed ===== -->
        <div class="alert alert-secondary small" th:if="${editing}">
            <b th:text="${p.type}">Type</b> in <b th:text="${p.city}">City</b>.
            The type and address cannot be changed here. To change them, delete the listing and add a new one.
        </div>

        <!-- ===== add mode: type ===== -->
        <div class="mb-3" th:if="${!editing}">
            <label class="form-label">Property type</label>
            <select name="type" class="form-select">
                <option th:each="t : ${typeOptions}" th:value="${t}" th:text="${t}"
                        th:selected="${t == form.type}">Type</option>
            </select>
            <div th:replace="~{fragments :: fieldError('type')}"></div>
        </div>

        <!-- ===== always: title, price, area, furnishing ===== -->
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" th:value="${form.title}">
            <div th:replace="~{fragments :: fieldError('title')}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Price (in lakh)</label>
                <input type="number" step="any" name="priceLakh" class="form-control" th:value="${form.priceLakh}">
                <div th:replace="~{fragments :: fieldError('priceLakh')}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Area (sq ft)</label>
                <input type="number" step="any" name="area" class="form-control" th:value="${form.area}">
                <div th:replace="~{fragments :: fieldError('area')}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Furnishing</label>
            <select name="furnishing" class="form-select">
                <option value="Unfurnished" th:selected="${form.furnishing == 'Unfurnished'}">Unfurnished</option>
                <option value="Semi" th:selected="${form.furnishing == 'Semi'}">Semi-furnished</option>
                <option value="Furnished" th:selected="${form.furnishing == 'Furnished'}">Furnished</option>
            </select>
        </div>

        <!-- ===== add mode: address ===== -->
        <div th:if="${!editing}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Street</label>
                    <input type="text" name="street" class="form-control" th:value="${form.street}">
                    <div th:replace="~{fragments :: fieldError('street')}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" th:value="${form.city}">
                    <div th:replace="~{fragments :: fieldError('city')}"></div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">State</label>
                    <input type="text" name="state" class="form-control" th:value="${form.state}">
                    <div th:replace="~{fragments :: fieldError('state')}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Pincode (6 digits)</label>
                    <input type="text" name="pincode" class="form-control" th:value="${form.pincode}">
                    <div th:replace="~{fragments :: fieldError('pincode')}"></div>
                </div>
            </div>
        </div>

        <!-- ===== bedrooms and bathrooms: houses, villas, apartments ===== -->
        <div class="row" th:if="${!editing or showBeds}">
            <div class="col-md-6 mb-3">
                <label class="form-label">Bedrooms <span class="text-muted small" th:if="${!editing}">(apartment, house, villa)</span></label>
                <input type="number" name="bedrooms" class="form-control" th:value="${form.bedrooms}">
                <div th:replace="~{fragments :: fieldError('bedrooms')}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Bathrooms <span class="text-muted small" th:if="${!editing}">(apartment, house, villa)</span></label>
                <input type="number" name="bathrooms" class="form-control" th:value="${form.bathrooms}">
                <div th:replace="~{fragments :: fieldError('bathrooms')}"></div>
            </div>
        </div>

        <!-- ===== parking: offices and shops ===== -->
        <div class="mb-3" th:if="${!editing or showParking}">
            <label class="form-label">Parking spaces <span class="text-muted small" th:if="${!editing}">(office, shop)</span></label>
            <input type="number" name="parking" class="form-control" th:value="${form.parking}">
            <div th:replace="~{fragments :: fieldError('parking')}"></div>
        </div>

        <!-- ===== add mode: details that depend on the type ===== -->
        <div class="card bg-light mb-3" th:if="${!editing}">
            <div class="card-body">
                <h6 class="card-title">Details for your type (fill in only what applies)</h6>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label small">Floor (apartment)</label>
                        <input type="number" name="floor" class="form-control form-control-sm" th:value="${form.floor}">
                        <div th:replace="~{fragments :: fieldError('floor')}"></div>
                    </div>
                    <div class="col-md-8 mb-2">
                        <label class="form-label small">Plot type (land), for example Commercial plot</label>
                        <input type="text" name="plotType" class="form-control form-control-sm" th:value="${form.plotType}">
                        <div th:replace="~{fragments :: fieldError('plotType')}"></div>
                    </div>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="lift" value="true" id="lift" th:checked="${form.lift}">
                    <label class="form-check-label small" for="lift">Lift (apartment)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="garden" value="true" id="garden" th:checked="${form.garden}">
                    <label class="form-check-label small" for="garden">Garden (house)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="pool" value="true" id="pool" th:checked="${form.pool}">
                    <label class="form-check-label small" for="pool">Pool (villa)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="conference" value="true" id="conference" th:checked="${form.conference}">
                    <label class="form-check-label small" for="conference">Conference room (office)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="roadFacing" value="true" id="roadFacing" th:checked="${form.roadFacing}">
                    <label class="form-check-label small" for="roadFacing">Road facing (shop)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="fenced" value="true" id="fenced" th:checked="${form.fenced}">
                    <label class="form-check-label small" for="fenced">Fenced (land)</label>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Amenities, separated by commas
                <span class="text-muted small" th:if="${editing}">(new ones are added to the existing list)</span>
            </label>
            <input type="text" name="amenities" class="form-control" placeholder="Lift, Parking, Gym"
                   th:value="${form.amenities}">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark" th:text="${editing} ? 'Save changes' : 'Add listing'">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/manage}">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
