<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favourites - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
    <h2 class="mb-3">My favourites</h2>

    <div class="row g-3">
        <th:block th:each="c : ${cards}">
            <div th:replace="~{fragments :: card(${c}, true, '/favourites')}"></div>
        </th:block>
    </div>

    <div class="text-center text-muted py-5" th:if="${cards.isEmpty()}">
        You have not saved anything yet. <a th:href="@{/listings}">Browse listings</a>
    </div>
</div>

</body>
</html>
