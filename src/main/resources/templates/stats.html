<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistics - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Statistics</h2>
        <a class="btn btn-dark" th:href="@{/admin/export}">Download CSV</a>
    </div>

    <!-- ===== counts ===== -->
    <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <div class="text-muted small">Listings</div>
            <div class="fs-2 fw-semibold" th:text="${s.totalListings}">12</div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <div class="text-muted small">Available</div>
            <div class="fs-2 fw-semibold text-success" th:text="${s.available}">10</div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <div class="text-muted small">Sold</div>
            <div class="fs-2 fw-semibold text-danger" th:text="${s.sold}">1</div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <div class="text-muted small">Rented</div>
            <div class="fs-2 fw-semibold text-warning" th:text="${s.rented}">1</div>
        </div></div></div>
    </div>

    <!-- ===== money and extremes ===== -->
    <div class="row g-3 mb-3">
        <div class="col-md-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <div class="text-muted small">Value of available listings</div>
            <div class="fs-5 fw-semibold" th:text="${s.availableValue}">Rs 8 Cr</div>
        </div></div></div>
        <div class="col-md-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <div class="text-muted small">Average price</div>
            <div class="fs-5 fw-semibold" th:text="${s.averagePrice}">Rs 87 L</div>
        </div></div></div>
        <div class="col-md-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <div class="text-muted small">Most expensive</div>
            <div class="small fw-semibold" th:text="${s.mostExpensive}">-</div>
        </div></div></div>
        <div class="col-md-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <div class="text-muted small">Cheapest</div>
            <div class="small fw-semibold" th:text="${s.cheapest}">-</div>
        </div></div></div>
    </div>

    <!-- ===== charts ===== -->
    <div class="row g-3 mb-3">
        <div class="col-lg-6">
            <div class="card shadow-sm"><div class="card-body">
                <h5 class="card-title">Average price by city</h5>
                <div class="mb-2" th:each="b : ${s.priceByCity}">
                    <div class="d-flex justify-content-between small">
                        <span th:text="${b.label}">City</span><span th:text="${b.valueText}">Rs 1 Cr</span>
                    </div>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-dark" role="progressbar" th:style="'width: ' + ${b.percent} + '%'"></div>
                    </div>
                </div>
            </div></div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow-sm"><div class="card-body">
                <h5 class="card-title">Listings by type</h5>
                <div class="mb-2" th:each="b : ${s.countByType}">
                    <div class="d-flex justify-content-between small">
                        <span th:text="${b.label}">Type</span><span th:text="${b.valueText}">3</span>
                    </div>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-dark" role="progressbar" th:style="'width: ' + ${b.percent} + '%'"></div>
                    </div>
                </div>
            </div></div>
        </div>
    </div>

    <!-- ===== people and activity ===== -->
    <div class="card shadow-sm"><div class="card-body">
        <h5 class="card-title">Users and activity</h5>
        <p class="mb-0" th:text="${s.buyers} + ' buyer(s), ' + ${s.agents} + ' agent(s), ' + ${s.admins} + ' admin(s). '
                + ${s.enquiryCount} + ' enquiries sent, ' + ${s.favouriteCount} + ' properties saved as favourites.'">
            Users
        </p>
    </div></div>
</div>

</body>
</html>
