<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enquiries - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
    <h2 class="mb-3" th:text="${heading}">Enquiries</h2>

    <div class="list-group shadow-sm">
        <div class="list-group-item" th:each="e : ${rows}">
            <div class="fw-semibold" th:text="${e.property.title}">Property</div>
            <div class="small text-muted"
                 th:text="'From ' + ${e.buyer.name} + ' (' + ${e.buyer.email} + ')'">From</div>
            <div class="my-1" th:text="${e.message}">Message</div>
            <a class="small" th:href="@{/listings/{id}(id=${e.property.id})}">View property</a>
        </div>
    </div>

    <div class="text-center text-muted py-5" th:if="${rows.isEmpty()}">Nothing here yet.</div>
</div>

</body>
</html>
