<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listings - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
    <div class="row g-4">

        <!-- ================= FILTER FORM ================= -->
        <div class="col-lg-3">
            <form method="get" th:action="@{/listings}" class="card card-body shadow-sm">
                <h5 class="mb-3">Filters</h5>

                <label class="form-label small mb-1">City</label>
                <select name="city" class="form-select form-select-sm mb-3">
                    <option value="">Any city</option>
                    <option th:each="c : ${cityOptions}" th:value="${c}" th:text="${c}"
                            th:selected="${c == form.city}">City</option>
                </select>

                <label class="form-label small mb-1">Property type</label>
                <div class="mb-3">
                    <div class="form-check" th:each="t : ${typeOptions}">
                        <input class="form-check-input" type="checkbox" name="types"
                               th:id="'type-' + ${t}" th:value="${t}" th:checked="${form.types.contains(t)}">
                        <label class="form-check-label small" th:for="'type-' + ${t}" th:text="${t}">Type</label>
                    </div>
                </div>

                <label class="form-label small mb-1">Price in lakh</label>
                <div class="input-group input-group-sm mb-3">
                    <input type="number" step="any" min="0" name="minPrice" class="form-control"
                           placeholder="Min" th:value="${form.minPrice}">
                    <input type="number" step="any" min="0" name="maxPrice" class="form-control"
                           placeholder="Max" th:value="${form.maxPrice}">
                </div>

                <label class="form-label small mb-1">Minimum bedrooms</label>
                <select name="minBedrooms" class="form-select form-select-sm mb-3">
                    <option value="">Any</option>
                    <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="${n} + '+'"
                            th:selected="${form.minBedrooms != null and form.minBedrooms == n}">1+</option>
                </select>

                <label class="form-label small mb-1">Furnishing</label>
                <select name="furnishing" class="form-select form-select-sm mb-3">
                    <option value="">Any</option>
                    <option value="Furnished" th:selected="${form.furnishing == 'Furnished'}">Furnished</option>
                    <option value="Semi" th:selected="${form.furnishing == 'Semi'}">Semi-furnished</option>
                    <option value="Unfurnished" th:selected="${form.furnishing == 'Unfurnished'}">Unfurnished</option>
                </select>

                <label class="form-label small mb-1">Must have</label>
                <div class="mb-3">
                    <div class="form-check form-check-inline" th:each="a : ${amenityOptions}">
                        <input class="form-check-input" type="checkbox" name="amenities"
                               th:id="'am-' + ${a}" th:value="${a}" th:checked="${form.amenities.contains(a)}">
                        <label class="form-check-label small" th:for="'am-' + ${a}" th:text="${a}">Amenity</label>
                    </div>
                </div>

                <label class="form-label small mb-1">Keyword</label>
                <input type="text" name="keyword" class="form-control form-control-sm mb-3"
                       placeholder="Title, street or type" th:value="${form.keyword}">

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="onlyAvailable" value="true"
                           id="onlyAvailable" th:checked="${form.onlyAvailable}">
                    <label class="form-check-label small" for="onlyAvailable">Only available listings</label>
                </div>

                <label class="form-label small mb-1">Match</label>
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="matchAny" value="false"
                               id="matchAll" th:checked="${!form.matchAny}">
                        <label class="form-check-label small" for="matchAll">All filters (AND)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="matchAny" value="true"
                               id="matchAnyOpt" th:checked="${form.matchAny}">
                        <label class="form-check-label small" for="matchAnyOpt">Any filter (OR)</label>
                    </div>
                </div>

                <label class="form-label small mb-1">Sort by</label>
                <select name="sort" class="form-select form-select-sm mb-3">
                    <option value="priceAsc" th:selected="${form.sort == 'priceAsc'}">Price: low to high</option>
                    <option value="priceDesc" th:selected="${form.sort == 'priceDesc'}">Price: high to low</option>
                    <option value="areaDesc" th:selected="${form.sort == 'areaDesc'}">Area: largest first</option>
                    <option value="newest" th:selected="${form.sort == 'newest'}">Newest first</option>
                </select>

                <button type="submit" class="btn btn-dark btn-sm w-100 mb-2">Apply filters</button>
                <a th:href="@{/listings}" class="btn btn-outline-secondary btn-sm w-100">Reset</a>
            </form>
        </div>

        <!-- ================= RESULTS ================= -->
        <div class="col-lg-9">
            <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">Error</div>

            <div class="alert alert-secondary py-2 small" th:if="${error == null}"
                 th:text="'Filters: ' + ${description}">Filters</div>

            <p class="text-muted"
               th:text="${matches} + ' of ' + ${total} + ' properties match  (page ' + ${page} + ' of ' + ${totalPages} + ')'">
                0 properties
            </p>

            <div class="row g-3">
                <th:block th:each="c : ${cards}">
                    <div th:replace="~{fragments :: card(${c}, ${favouriteIds.contains(c.id)}, ${next})}"></div>
                </th:block>
            </div>

            <div class="text-center text-muted py-5" th:if="${cards.isEmpty() and error == null}">
                No properties match these filters. Try removing one, or switch to "Any filter (OR)".
            </div>

            <!-- ================= PAGE BUTTONS ================= -->
            <nav th:if="${totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
                        <a class="page-link" th:href="${'/listings?' + query + 'page=' + (page - 1)}">Previous</a>
                    </li>
                    <li class="page-item" th:each="n : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${n == page} ? 'active'">
                        <a class="page-link" th:href="${'/listings?' + query + 'page=' + n}" th:text="${n}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${page == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="${'/listings?' + query + 'page=' + (page + 1)}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>

    </div>
</div>

</body>
</html>
