<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listings - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">HomeScout</a>
        <a class="nav-link text-white" href="/listings">Listings</a>
    </div>
</nav>

<div class="container">
    <h2 class="mb-1">All listings</h2>
    <p class="text-muted" th:text="${cards.size()} + ' properties'">0 properties</p>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="c : ${cards}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <span class="badge text-bg-secondary" th:text="${c.type}">Type</span>
                        <span class="badge" th:classappend="'text-bg-' + ${c.statusClass}" th:text="${c.status}">Status</span>
                    </div>
                    <h5 class="card-title mt-2" th:text="${c.title}">Title</h5>
                    <p class="text-muted mb-1" th:text="${c.city}">City</p>
                    <p class="fs-5 fw-semibold mb-1" th:text="${c.price}">Price</p>
                    <p class="mb-0 small" th:text="${c.area} + ' | ' + ${c.features}">Area | Features</p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
