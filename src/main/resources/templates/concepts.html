<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OOP concepts - HomeScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: nav}"></div>

<div class="container pb-5">
    <h2>OOP concepts, live</h2>
    <p class="text-muted">
        Every block below runs real code from this project on the current data.
        The grey line under each title tells you which files to open.
    </p>

    <div class="card shadow-sm mb-3" th:each="s : ${sections}">
        <div class="card-body">
            <h5 class="card-title mb-0">
                <span class="badge text-bg-dark me-2" th:text="${s.number}">1</span><span th:text="${s.title}">Title</span>
            </h5>
            <div class="small text-muted mb-2" th:text="'Files: ' + ${s.where}">Files</div>
            <div class="font-monospace small text-break" style="white-space: pre-wrap;"
                 th:each="l : ${s.lines}" th:text="${l}">line</div>
        </div>
    </div>
</div>

</body>
</html>
